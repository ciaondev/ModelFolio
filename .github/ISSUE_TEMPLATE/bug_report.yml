name: 문제 보고 · Bug report
description: 앱이 멈추거나 이상하게 동작할 때 · Something is broken or behaves oddly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        앱의 About(ⓘ) → [문제 보고]로 열면 버전·Windows·그래픽카드가 미리 채워집니다.
        Opening this from About (ⓘ) → Report a problem fills in the version, Windows and GPU for you.
        작품 파일(3MF 등)이나 개인 정보는 올리지 마세요. · Please don't attach your model files or personal info.
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요? · What happened?
      description: 무엇을 하다가, 무엇이 나왔고, 무엇을 기대했는지 · What you did, what you saw, what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 해 보는 방법 · Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: version
    attributes:
      label: ModelFolio 버전 · Version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows
  - type: input
    id: gpu
    attributes:
      label: 그래픽카드 · GPU
  - type: textarea
    id: log
    attributes:
      label: 로그 · Log
      description: About → [로그 폴더]의 modelfolio.log에서 문제가 난 무렵 몇 줄 (사용자 폴더·이름은 이미 지워져 있습니다) · A few lines from modelfolio.log in About → Log folder (user folder and name are already removed)
      render: text
